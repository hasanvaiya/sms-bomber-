<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON SHADOW | OTP BOMBER</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: radial-gradient(circle at center, #0f172a, #000000); font-family: 'Courier New', monospace; }
    .neon-text { text-shadow: 0 0 15px #22ff88, 0 0 30px #22ff88; }
    .glass { background: rgba(15, 23, 42, 0.9); border: 1px solid #22ff88; }
  </style>
</head>
<body class="text-green-400 min-h-screen p-6">

  <div class="max-w-6xl mx-auto">
    <div class="text-center mb-10">
      <h1 class="text-6xl font-bold neon-text">NEON SHADOW</h1>
      <p class="text-red-500 text-2xl">MULTI SERVICE OTP BOMBER</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="glass rounded-3xl p-8 lg:col-span-2">
        <h2 class="text-2xl font-bold mb-6">MULTI ATTACK MODE</h2>

        <input id="number" type="text" placeholder="017XXXXXXXX" 
               class="w-full p-5 bg-black border border-green-500 rounded-2xl text-xl mb-6">

        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="block text-sm mb-2">INTERVAL (Seconds)</label>
            <input id="interval" type="number" value="6" min="4" 
                   class="w-full p-5 bg-black border border-green-500 rounded-2xl">
          </div>
          <div>
            <label class="block text-sm mb-2">MAX REQUESTS (0 = Unlimited)</label>
            <input id="maxRequests" type="number" value="0" min="0" 
                   class="w-full p-5 bg-black border border-green-500 rounded-2xl">
          </div>
        </div>

        <div class="mt-8 flex gap-4">
          <button onclick="startAllAttack()" 
                  class="flex-1 bg-green-600 hover:bg-green-500 py-7 rounded-2xl text-2xl font-bold">
            <i class="fas fa-bolt"></i> START ALL SERVICES
          </button>
          <button onclick="stopAttack()" 
                  class="flex-1 bg-red-600 hover:bg-red-500 py-7 rounded-2xl text-2xl font-bold">
            <i class="fas fa-stop"></i> STOP
          </button>
        </div>
      </div>

      <div class="glass rounded-3xl p-6">
        <div id="status" class="text-xl font-bold text-center min-h-[60px]"></div>
        <div id="counter" class="text-3xl font-bold text-yellow-400 text-center mt-4"></div>
        <div id="log" class="mt-6 h-96 overflow-auto text-sm font-mono bg-black/70 p-4 rounded-2xl"></div>
      </div>
    </div>
  </div>

  <script>
    let intervalId = null;
    let totalCount = 0;

    function log(msg, color = "text-green-400") {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      logDiv.innerHTML += `<span class="${color}">[${time}] ${msg}</span><br>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function startAllAttack() {
      const number = document.getElementById('number').value.trim();
      const intervalMs = parseInt(document.getElementById('interval').value) * 1000;
      const maxRequests = parseInt(document.getElementById('maxRequests').value) || 0;

      if (!number) return alert("নাম্বার দিন");

      if (intervalId) return alert("ইতিমধ্যে চলছে!");

      totalCount = 0;
      document.getElementById('counter').textContent = "TOTAL REQUESTS: 0";
      document.getElementById('status').innerHTML = `<span class="text-green-400">● MULTI ATTACK RUNNING</span>`;

      log(`🚀 MULTI SERVICE ATTACK STARTED on ${number}`, "text-yellow-400");

      intervalId = setInterval(async () => {
        // Get all services from backend
        const res = await fetch('/services');
        const serviceList = await res.json();

        serviceList.forEach(async (serviceName) => {
          try {
            const response = await fetch('/start', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ 
                number, 
                serviceName, 
                intervalMs: 1000, 
                maxRequests: 0 
              })
            });
            totalCount++;
            document.getElementById('counter').textContent = `TOTAL REQUESTS: ${totalCount}`;
          } catch (e) {}
        });

      }, intervalMs);
    }

    async function stopAttack() {
      if (intervalId) clearInterval(intervalId);
      intervalId = null;

      // Stop all running sessions
      const number = document.getElementById('number').value.trim();
      if (number) {
        await fetch('/stop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ number })
        });
      }

      document.getElementById('status').innerHTML = `<span class="text-red-500">● ALL ATTACKS STOPPED</span>`;
      log("⛔ ALL SERVICES STOPPED", "text-red-400");
    }

    window.onload = () => {
      log("NEON SHADOW MULTI SERVICE MODE LOADED", "text-yellow-400");
    };
  </script>
</body>
</html>
